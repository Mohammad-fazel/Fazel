<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<title>مهندس محمد فاضل درویشی | کارت ویزیت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#05080d;
  --ink:#f1f5fa;
  --dim:#9fb0c4;
  --cy:#5ee1ff;
  --bl:#3b82ff;
  --am:#ffc857;
  --glass:rgba(255,255,255,.055);
  --edge:rgba(255,255,255,.14);
  --pad:14px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);min-height:100%}
body{
  min-height:100vh;min-height:100dvh;
  font-family:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  padding:calc(var(--pad) + env(safe-area-inset-top,0px)) var(--pad) calc(var(--pad) + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;align-items:center;
  background:
    radial-gradient(55% 40% at 50% -5%,rgba(59,130,255,.28),transparent 70%),
    radial-gradient(45% 35% at 100% 100%,rgba(94,225,255,.12),transparent 70%),
    radial-gradient(35% 30% at 0% 70%,rgba(255,200,87,.06),transparent 70%),
    var(--bg);
  overflow-x:hidden;
}
.stage{width:100%;max-width:460px;perspective:1500px;perspective-origin:50% 35%}
.enter{animation:in 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(36px) rotateX(14deg) scale(.96)}to{opacity:1;transform:none}}
.tilt{
  transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .3s ease-out;will-change:transform;
}
.tilt.live{transition:transform .06s linear}
.card{
  position:relative;transform-style:preserve-3d;border-radius:30px;
  padding:0 18px 22px;
  filter:drop-shadow(0 30px 40px rgba(0,0,0,.65)) drop-shadow(0 0 40px rgba(59,130,255,.14));
}
/* back plate: clipped, holds banner + canvas */
.plate{
  position:absolute;inset:0;border-radius:30px;overflow:hidden;
  background:linear-gradient(180deg,#0c1119,#070a10 60%,#06080c);
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(0,0,0,.5);
}

.plate .tint{position:absolute;inset:0 0 auto 0;height:280px;background:linear-gradient(180deg,rgba(5,8,13,.55),rgba(5,8,13,.1) 40%,rgba(12,17,25,0))}
.plate canvas{position:absolute;left:0;top:0;width:100%;height:300px;mix-blend-mode:screen;opacity:.95}
.flash{position:absolute;inset:0 0 auto 0;height:280px;background:radial-gradient(60% 80% at 70% 30%,rgba(150,200,255,.5),transparent 70%);opacity:0;mix-blend-mode:screen;animation:flash 7s infinite}
@keyframes flash{0%,93%,100%{opacity:0}94%{opacity:.7}95%{opacity:.1}96.5%{opacity:.55}98%{opacity:0}}
.glare{position:absolute;inset:0;border-radius:30px;pointer-events:none;z-index:30;
  background:radial-gradient(circle at var(--gx,30%) var(--gy,8%),rgba(255,255,255,.14),transparent 45%);
  mix-blend-mode:soft-light;transform:translateZ(1px)}

.top{position:relative;transform-style:preserve-3d;display:flex;justify-content:space-between;align-items:center;padding-top:18px;height:56px;direction:rtl}
.tag{font-size:11px;letter-spacing:.22em;color:rgba(255,255,255,.7);font-weight:500;line-height:1.5;text-transform:none;direction:ltr}
.nfc{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#e8eef7;letter-spacing:.04em}
.nfc svg{width:18px;height:18px;stroke:var(--cy);fill:none;stroke-width:2;stroke-linecap:round}

/* hero: centered framed portrait */
.hero{position:relative;transform-style:preserve-3d;display:flex;flex-direction:column;align-items:center;margin:14px 0 0}
.fw{position:relative;transform-style:preserve-3d;width:min(64%,262px)}
.ground{position:absolute;left:8%;right:8%;bottom:-14px;height:34px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(59,130,255,.55),transparent 70%);filter:blur(8px);transform:translateZ(8px)}
.frame{position:relative;aspect-ratio:1/1.1;padding:3px;border-radius:50% 50% 30px 30px/44% 44% 30px 30px;
  background:conic-gradient(from var(--a,0deg),var(--cy),var(--bl),#1a2b4d 40%,var(--am) 62%,#1a2b4d 80%,var(--cy));
  animation:spin 10s linear infinite;transform:translateZ(54px);
  box-shadow:0 26px 40px rgba(0,0,0,.7),0 0 46px rgba(59,130,255,.32)}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.shot{position:relative;width:100%;height:100%;border-radius:inherit;overflow:hidden;background:#0b0f15}
.shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:56% 18%;filter:contrast(1.05) brightness(.98)}
.shot::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,transparent 60%,rgba(5,8,13,.55)),radial-gradient(90% 60% at 50% 0%,rgba(94,225,255,.14),transparent 70%);
  box-shadow:inset 0 0 26px rgba(0,0,0,.5)}
.shot::after{content:"";position:absolute;top:-20%;bottom:-20%;width:34%;left:-50%;z-index:2;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.32),transparent);transform:skewX(-14deg);
  animation:sweep 7s ease-in-out 1.6s infinite}
@keyframes sweep{0%{left:-50%}18%,100%{left:130%}}
.bolt{position:absolute;right:-8px;bottom:22px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transform:translateZ(96px);
  background:radial-gradient(circle at 50% 25%,#ffe08a,#ffb12b 60%,#c47a08);
  box-shadow:0 10px 18px rgba(0,0,0,.6),inset 0 2px 3px rgba(255,255,255,.7),inset 0 -3px 5px rgba(120,60,0,.5),0 0 22px rgba(255,190,60,.55)}
.bolt svg{width:22px;height:22px;fill:#3a2300}
.id{position:relative;text-align:center;margin-top:26px;transform:translateZ(34px);direction:rtl}
.id small{display:block;font-size:14px;color:var(--dim);font-weight:500}
.id h1{font-size:clamp(28px,8.4vw,36px);font-weight:800;line-height:1.35;margin-top:2px;
  background:linear-gradient(180deg,#fff 25%,#9fb4d0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(0,0,0,.6))}
.latin{font-family:"Mrs Saint Delafield","Snell Roundhand",cursive;font-style:italic;font-size:32px;line-height:1;color:#cfe0f5;margin-top:2px;direction:ltr;text-shadow:0 0 14px rgba(94,225,255,.35)}
.role{
  display:inline-flex;align-items:center;gap:8px;margin-top:14px;white-space:nowrap;padding:7px 16px;border-radius:999px;
  font-size:14px;font-weight:500;color:#e8f2ff;
  background:linear-gradient(180deg,rgba(94,225,255,.16),rgba(59,130,255,.08));
  border:1px solid rgba(94,225,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 22px rgba(59,130,255,.25);
}
.role i{width:7px;height:7px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.uni{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:16px;transform:translateZ(18px)}
.uni img{width:38px;height:38px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6))}
.uni b{font-size:15px;font-weight:700;color:#dfe8f4}

.chips{display:flex;justify-content:center;gap:10px;margin-top:20px;transform:translateZ(24px)}
.chip{flex:1;max-width:92px;text-align:center;padding:10px 4px 8px;border-radius:16px;background:var(--glass);border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 14px rgba(0,0,0,.4)}
.chip svg{width:26px;height:26px;stroke:var(--cy);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(94,225,255,.5))}
.chip span{display:block;margin-top:4px;font-size:11px;color:var(--dim);font-weight:500;white-space:nowrap}

/* links */
.links{display:grid;gap:12px;margin-top:22px;transform-style:preserve-3d}
.btn{
  --c:var(--bl);
  position:relative;display:flex;align-items:center;gap:14px;direction:ltr;
  padding:12px 16px 12px 12px;border-radius:22px;text-decoration:none;color:var(--ink);
  background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 50%,rgba(255,255,255,.05));
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.5),0 12px 20px rgba(0,0,0,.5);
  transform:translateZ(34px);
  transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s;
  outline:none;overflow:visible;
  animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
}
.btn:nth-child(1){animation-delay:.45s}.btn:nth-child(2){animation-delay:.55s}.btn:nth-child(3){animation-delay:.65s}.btn:nth-child(4){animation-delay:.75s}
@keyframes rise{from{opacity:0;transform:translateZ(0) translateY(18px)}to{opacity:1;transform:translateZ(34px)}}
.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(80% 140% at 0% 50%,color-mix(in srgb,var(--c) 30%,transparent),transparent 65%);opacity:.55;transition:opacity .3s;pointer-events:none}
.btn:hover,.btn:focus-visible{transform:translateZ(58px) translateY(-3px);border-color:color-mix(in srgb,var(--c) 65%,white 10%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 22px 30px rgba(0,0,0,.6),0 0 30px color-mix(in srgb,var(--c) 45%,transparent)}
.btn:hover::before{opacity:1}
.btn:focus-visible{box-shadow:0 0 0 2px #9cc4ff,0 22px 30px rgba(0,0,0,.6)}
.btn:active{transform:translateZ(20px) scale(.985)}
.orb{position:relative;flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 25%,#2d3138,#07080a 75%);
  box-shadow:inset 0 0 0 3px #040405,inset 0 0 0 4px rgba(255,255,255,.14),0 8px 12px rgba(0,0,0,.7);
  transform:translateZ(14px)}
.orb .in{position:absolute;inset:5px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  box-shadow:inset 0 -4px 6px rgba(0,0,0,.4),inset 0 2px 3px rgba(255,255,255,.4)}
.orb .in::after{content:"";position:absolute;left:12%;right:12%;top:3%;height:46%;border-radius:50%/70% 70% 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.orb svg{position:relative;z-index:1;width:54%;height:54%}
.c-call{--c:#9aa7b8}.c-call .in{background:radial-gradient(circle at 50% 25%,#434852,#0b0c0e 75%)}
.c-tg{--c:#2aa8ff}.c-tg .in{background:radial-gradient(circle at 50% 20%,#62c7ff,#1d7fd6 55%,#0b4fa6)}
.c-wa{--c:#25d366}.c-wa .in{background:radial-gradient(circle at 50% 20%,#62e070,#1fa83a 55%,#0d7a26)}
.c-ig{--c:#e1306c}.c-ig .in{background:radial-gradient(circle at 30% 105%,#fdc851,#f5622d 28%,#d3256c 55%,#8a2bd0 80%,#5a3cd6)}
.btn .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35;position:relative}
.btn .tx small{font-size:13px;color:var(--dim);font-weight:500}
.btn .tx b{font-size:17px;font-weight:500;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis}
.go{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid var(--edge);transition:transform .3s,background .3s}
.go svg{width:16px;height:16px;stroke:#e7eef8;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:hover .go{transform:translateX(4px);background:color-mix(in srgb,var(--c) 40%,transparent)}

.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px;transform:translateZ(16px)}
.slogan{font-size:13px;color:var(--dim);font-weight:400}
.share{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:inherit;font-size:13px;font-weight:500;color:#e8f2ff;
  padding:9px 14px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16);transition:background .2s,border-color .2s}
.share:hover,.share:focus-visible{background:rgba(94,225,255,.14);border-color:rgba(94,225,255,.5);outline:none}
.share svg{width:16px;height:16px;stroke:var(--cy);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#10161f;border:1px solid var(--edge);padding:10px 18px;border-radius:999px;font-size:14px;transition:.3s;z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* DESKTOP */
@media (min-width:900px){
  :root{--pad:32px}
  .stage{max-width:1040px}
  .card{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"top top" "right left";column-gap:36px;padding:0 44px 40px;transform-style:preserve-3d}
  .plate .banner,.plate .tint,.flash{height:360px}
  .plate canvas{height:360px;opacity:.5}
  .top{grid-area:top;height:64px;padding-top:26px}
  .left{grid-area:left;align-self:center;transform-style:preserve-3d;padding-top:34px}
  .right{grid-area:right;align-self:center;padding-top:60px;transform-style:preserve-3d}
  .hero{margin-top:30px}
  .fw{width:250px}
  .id h1{font-size:38px}
  .links{margin-top:0}
  .btn{padding:14px 18px 14px 14px}
  .orb{width:62px;height:62px}
  .foot{margin-top:26px}
}
@media (max-width:360px){.chip span{font-size:10px}.btn .tx b{font-size:15px}}
@media (prefers-reduced-motion:reduce){.enter,.btn,.portrait,.flash,.role i{animation:none!important}.tilt{transition:none}}
</style>

        <button class="share" id="share" type="button"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg>اشتراک‌گذاری</button>
      </div>
    </section>
   </article>
  </div>
 </div>
</main>
<div class="toast" id="toast" role="status">لینک کپی شد</div>

<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tilt=document.getElementById('tilt'),card=document.getElementById('card');

  /* animated power waveforms */
  var cv=document.getElementById('wave'),cx=cv.getContext('2d'),W=0,H=0,dpr=Math.min(devicePixelRatio||1,2);
  function size(){var r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
  var waves=[{c:'94,225,255',a:.55,f:1.6,s:.9,p:0},{c:'59,130,255',a:.7,f:1.1,s:-.7,p:2},{c:'255,200,87',a:.35,f:2.3,s:1.2,p:4}];
  function sparks(t){
    for(var i=0;i<16;i++){
      var x=((i*61)%100)/100*W,sp=.018+(i%5)*.008,y=H*(1-(((t*sp)+i*.137)%1));
      var tw=.5+.5*Math.sin(t*1.6+i*2.1),r=.8+(i%3)*.6;
      cx.beginPath();cx.arc(x+Math.sin(t*.5+i)*6,y,r,0,6.283);
      cx.fillStyle=(i%4?'rgba(150,225,255,':'rgba(255,205,110,')+(.12+.38*tw)+')';cx.shadowColor=cx.fillStyle;cx.shadowBlur=8;cx.fill();
    }
  }
  function draw(t){
    cx.clearRect(0,0,W,H);sparks(t);
    var base=H*.80;
    waves.forEach(function(w){
      cx.beginPath();
      for(var x=0;x<=W;x+=4){
        var k=x/W,env=Math.sin(Math.PI*k);
        var y=base+Math.sin(k*Math.PI*2*w.f+t*w.s+w.p)*H*.045*w.a*(.4+env);
        x?cx.lineTo(x,y):cx.moveTo(x,y);
      }
      cx.strokeStyle='rgba('+w.c+',.85)';cx.lineWidth=1.6;cx.shadowColor='rgba('+w.c+',1)';cx.shadowBlur=12;cx.stroke();
    });
  }
  size();addEventListener('resize',size);
  if(reduce){draw(0)}else{(function loop(ms){draw(ms/1000);requestAnimationFrame(loop)})(0)}

  /* 3D tilt */
  if(!reduce){
    var max=8,raf=0;
    function apply(px,py){
      tilt.style.setProperty('--ry',((px-.5)*2*max).toFixed(2)+'deg');
      tilt.style.setProperty('--rx',(-(py-.5)*2*max*.7).toFixed(2)+'deg');
      card.style.setProperty('--gx',(px*100)+'%');card.style.setProperty('--gy',(py*100)+'%');
      document.querySelector('.glare').style.setProperty('--gx',(px*100)+'%');
      document.querySelector('.glare').style.setProperty('--gy',(py*100)+'%');
    }
    addEventListener('pointermove',function(e){
      if(raf)return;var x=e.clientX,y=e.clientY;
      raf=requestAnimationFrame(function(){raf=0;tilt.classList.add('live');apply(Math.min(1,Math.max(0,x/innerWidth)),Math.min(1,Math.max(0,y/innerHeight)))});
    },{passive:true});
    function leave(){tilt.classList.remove('live');tilt.style.setProperty('--rx','0deg');tilt.style.setProperty('--ry','0deg')}
    document.addEventListener('pointerleave',leave);addEventListener('blur',leave);
    addEventListener('pointerup',function(e){if(e.pointerType!=='mouse')setTimeout(leave,600)});
    if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission!=='function'&&'ontouchstart' in window){
      addEventListener('deviceorientation',function(e){
        if(e.gamma==null)return;tilt.classList.add('live');
        apply(.5+Math.max(-25,Math.min(25,e.gamma))/50,.5+Math.max(-20,Math.min(20,(e.beta||50)-50))/40);
      },{passive:true});
    }
  }

  /* share */
  var toast=document.getElementById('toast');
  function show(m){toast.textContent=m;toast.classList.add('on');setTimeout(function(){toast.classList.remove('on')},1800)}
  document.getElementById('share').addEventListener('click',function(){
    var d={title:document.title,text:'کارت ویزیت مهندس محمد فاضل درویشی',url:location.href};
    if(navigator.share){navigator.share(d).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(function(){show('لینک کپی شد')},function(){show('کپی نشد')})}
    else{show('لینک صفحه را کپی کنید')}
  });
})();
</script>
</body>
</html>
